<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; connect-src 'self'; img-src data:">
<title>MeTranscript</title>
<script>try { if (localStorage.getItem('metranscript.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch { /* storage may be blocked */ }</script>
<link rel="icon" href="data:,">
<style>
@font-face {
  font-family: "Hanken Grotesk"; font-weight: 400 500; font-display: swap;
  src: url(/fonts/hanken-grotesk-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Hanken Grotesk"; font-weight: 400 500; font-display: swap;
  src: url(/fonts/hanken-grotesk-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "JetBrains Mono"; font-weight: 300 500; font-display: swap;
  src: url(/fonts/jetbrains-mono-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root {
  --bg: #FBF8F3;
  --surface: #FFFDF9;
  --ink: #1A1613;
  --gray: #6B635A;
  --line: #E7E2DA;
  --edge: #8C8378;
  --pill: #EDE6DA;
  --dark: #1F1A16;
  --btn: #1F1A16;
  --on-btn: #FBF8F3;
  --rec: #C8412F;
  --others: #A66A1F;
  --rec-bg: #C8412F;
  --hit: #F3E7D6;
  --scrim: rgba(24, 24, 24, .35);
  --font: "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 4px;
  --r-lg: 6px;
  --drawer: clamp(380px, 26vw, 520px);
}
/* --dark stays a dark surface (record strip, detected banner); --btn is what buttons and the user bubble use, so it inverts. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141311;
  --surface: #1D1B18;
  --ink: #EFEBE4;
  --gray: #A39E95;
  --line: #34312C;
  --edge: #6F685F;
  --pill: #2A2723;
  --dark: #26231F;
  --btn: #EFEBE4;
  --on-btn: #1A1613;
  --rec: #EC6B55;
  --others: #D39A52;
  --hit: #3A3226;
  --scrim: rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
::selection { background: var(--ink); color: var(--bg); }
input, textarea { caret-color: var(--rec); }
* { scrollbar-color: var(--edge) transparent; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* type scale: 12 / 14 / 16 / 20 / 28 / 40 */
.t12, .lbl { font-size: 12px; }
.t20 { font-size: 20px; letter-spacing: -0.02em; line-height: 1.25; }
.t28 { font-size: 28px; letter-spacing: -0.03em; line-height: 1.12; }
.lbl, .muted { color: var(--gray); }
.error { color: var(--rec); }

/* pills */
.pill { border: 1px solid transparent; border-radius: var(--r); padding: 7px 16px; background: var(--pill); font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pill:hover { filter: brightness(.96); }
.pill.dark { background: var(--btn); color: var(--on-btn); }
.pill.rec { background: var(--rec-bg); color: #fff; border-radius: 999px; }
.pill.ghost { background: transparent; border-color: var(--edge); }
.pill[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.pill:disabled { opacity: .45; cursor: default; filter: none; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 14px 32px; background: var(--bg); border-bottom: 1px solid var(--ink); }
.top nav { display: flex; gap: 20px; }
.top nav a, .top nav button { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; font-size: 14px; }
.top nav [aria-current="page"], .top nav [aria-expanded="true"] { text-decoration: underline; text-underline-offset: 5px; }
.wordmark { font-weight: 500; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
.top .right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.langsw { display: inline-flex; border: 1px solid var(--edge); border-radius: var(--r); overflow: hidden; }
.langsw button { background: none; border: 0; padding: 6px 10px; cursor: pointer; font: 400 12px/1.5 var(--mono); color: var(--gray); }
.langsw button + button { border-left: 1px solid var(--edge); }
.langsw button[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); }
#strip .langsw { border-color: rgba(255,255,255,.35); }
#strip .langsw button { color: #C9C9C9; }
#strip .langsw button + button { border-left-color: rgba(255,255,255,.35); }
#strip .langsw button[aria-pressed="true"] { background: #fff; color: #1A1613; }
body.recording .top { display: none; }

/* status line */
#status { padding: 0 32px; min-height: 0; }
#status:not(:empty) { padding: 10px 32px; border-bottom: 1px solid var(--line); background: var(--surface); }

/* meeting detected */
#detected { display: none; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 32px; background: var(--dark); color: #fff; }
#detected.show { display: flex; }
#detected p { margin: 0; flex: 1 1 260px; }
#detected .pill { background: #fff; color: #181818; }
#detected .pill.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }

/* upcoming panel */
#upcoming-panel { display: none; padding: 20px 32px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
#upcoming-panel.open { display: block; }
#upcoming-panel ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 0; max-width: 760px; }
#upcoming-panel li { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
#upcoming-panel .time { font: 400 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; }

/* recording strip */
#strip { display: none; position: sticky; top: 0; z-index: 6; background: var(--dark); color: #fff; border-top: 2px solid var(--rec); border-bottom: 1px solid rgba(255,255,255,.1); padding: 12px 32px; gap: 20px; align-items: center; flex-wrap: wrap; }
body.recording #strip { display: flex; }
#strip .lbl { color: #C9C9C9; }
#stop { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none; }
#stop span { width: 14px; height: 14px; border-radius: 3px; background: var(--rec); }
#stop:disabled { opacity: .4; cursor: default; }
#strip .now { min-width: 0; flex: 1 1 220px; }
#strip .now .lbl { display: block; overflow-wrap: anywhere; }
#strip-clock { font: 400 40px/1.05 var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.1; }
#strip .devs { display: grid; gap: 6px; font-size: 12px; min-width: 0; flex: 0 1 360px; }
#strip .dev { display: grid; grid-template-columns: 64px minmax(0, 1fr) 96px; gap: 8px; align-items: center; }
#strip .dev .lbl::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: var(--meter); }
#strip .dev:nth-child(1) { --meter: #EFEBE4; }
#strip .dev:nth-child(2) { --meter: #D39A52; }
body.on-air #strip-label::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--rec); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
#strip select { min-width: 0; width: 100%; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: var(--r); padding: 3px 8px; font-size: 12px; }
#strip select option { color: var(--ink); background: var(--surface); }
#strip i { height: 14px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 3px, transparent 3px 6px); overflow: hidden; display: block; }
#strip i b { display: block; height: 100%; width: 0; background: var(--meter); transition: width .12s linear; -webkit-mask: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 6px); mask: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 6px); }
#strip .nav { display: flex; gap: 8px; }
#strip .pill { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }

/* page */
main { padding: 32px clamp(16px, 3vw, 56px) 64px; max-width: 1680px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.filters { display: flex; gap: 22px; flex-wrap: wrap; margin: 0 0 20px; }
.filters .pill { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 4px 0; filter: none; color: var(--gray); }
.filters .pill:hover { color: var(--ink); }
.filters .pill[aria-pressed="true"] { background: none; color: var(--ink); border-bottom-color: var(--ink); }

/* index list */
.index { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
.index a { display: grid; grid-template-columns: 56px minmax(0, 1fr) 90px 120px; gap: 20px; align-items: baseline; padding: 18px 12px; margin: 0 -12px; border-top: 1px solid var(--line); text-decoration: none; }
.index .title { font-size: 28px; letter-spacing: -0.03em; line-height: 1.12; overflow-wrap: anywhere; }
.index a:hover .title, .index a:focus-visible .title { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
.index .no-summary .title { color: var(--gray); }
.index a:hover, .index a:focus-visible { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.index .num, .index .app, .index .date { color: var(--gray); font: 400 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
.index .num { font-size: 20px; color: var(--ink); }
.index .date { text-align: right; }
.empty-state { padding: 48px 0; max-width: 48ch; }

.settings { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.settings label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.settings input { accent-color: var(--dark); }

/* meeting article */
.article { display: grid; grid-template-columns: minmax(0, 1fr) 10px var(--drawer); gap: 0; align-items: start; }
.body { padding-right: 40px; min-width: 0; }
.toolrow { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.tools { display: flex; gap: 18px; }
.link.danger { color: var(--rec); }
.link:disabled { color: var(--gray); cursor: default; text-decoration: none; }
input.rename { display: block; width: 100%; margin: 6px 0 12px; font: inherit; font-size: 40px; letter-spacing: -0.03em; line-height: 1.05; border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 4px 18px; background: var(--surface); }
.masthead { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; align-items: end; margin: 24px 0 12px; }
.masthead .big-num { font: 300 72px/.85 var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.meeting-title { font-size: 40px; letter-spacing: -0.03em; line-height: 1.05; font-weight: 400; margin: 0; overflow-wrap: anywhere; }
.head + .meeting-title { margin: 6px 0 12px; }
.meta { display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--gray); margin: 0 0 28px 164px; }
.sec { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; padding: 24px 0; border-top: 1px solid var(--line); }
.sec > .lbl { padding-top: 4px; }
.reading { font-size: 16px; line-height: 1.6; max-width: 80ch; }
.reading h1, .reading h2, .reading h3 { font-weight: 400; font-size: 20px; letter-spacing: -0.02em; line-height: 1.25; margin: 24px 0 8px; }
.reading > :first-child { margin-top: 0; }
.reading ul { padding-left: 1.2em; margin: 8px 0; }
.reading li { margin: 4px 0; }
.reading p { margin: 8px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
.actions .msg { color: var(--gray); }
textarea.notes { width: 100%; min-height: 160px; border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 16px 18px; background: var(--surface); font-size: 16px; line-height: 1.6; resize: vertical; }
.saved { color: var(--gray); font-size: 12px; }
.transcript p { margin: 0 0 8px; }
.transcript time { color: var(--gray); font: 400 12px/1.5 var(--mono); font-variant-numeric: tabular-nums; margin-right: 8px; }
.who { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em; margin-right: 8px; }
.who::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: var(--ink); }
p.others { margin-left: 28px; }
p.others .who::before { background: var(--others); }
.tl { margin: 0 0 18px; }
.tl-bar { position: relative; height: 16px; background: var(--line); cursor: pointer; }
.tl-bar span { position: absolute; top: 0; bottom: 0; background: var(--ink); }
.tl-bar span.others { background: var(--others); top: 40%; }
.tl-bar span.me { bottom: 40%; }
.tl-share { margin-top: 6px; font: 400 12px/1.5 var(--mono); color: var(--gray); }
.transcript p.hit { background: var(--hit); border-radius: 6px; box-shadow: 0 0 0 6px var(--hit); }

/* resizable drawer */
.handle { align-self: stretch; cursor: col-resize; display: grid; place-items: center; touch-action: none; }
.handle::after { content: ""; width: 2px; height: 48px; border-radius: 2px; background: var(--line); }
.handle:hover::after, .handle:focus-visible::after { background: var(--gray); }
.drawer { position: sticky; top: 88px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: calc(100vh - 120px); min-height: 420px; overflow: hidden; }
.drawer header { padding: 18px 20px 4px; }
.drawer .privacy { padding: 0 20px 10px; font-size: 12px; color: var(--gray); }
.chat-log { overflow-y: auto; padding: 4px 20px 16px; display: grid; align-content: start; gap: 10px; }
.msg { border-radius: var(--r-lg); padding: 10px 14px; max-width: 92%; overflow-wrap: anywhere; font-size: 14px; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
.msg ul { margin: 4px 0; padding-left: 1.1em; }
.msg.me { justify-self: end; background: var(--btn); color: var(--on-btn); }
.msg.bot { justify-self: start; background: var(--bg); }
.msg small { display: block; margin-top: 6px; color: var(--gray); font-size: 12px; }
.msg a[data-t] { font: 400 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
.chat-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
.chat-form textarea { border: 1px solid var(--edge); border-radius: var(--r); padding: 9px 14px; background: var(--surface); resize: none; max-height: 160px; }
#chat-msg { grid-column: 1 / -1; font-size: 12px; }
#chat-msg:empty { display: none; }

/* live view */
.live { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.feed { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; min-height: 240px; max-height: 60vh; overflow-y: auto; font-size: 14px; }
.feed p { margin: 0 0 8px; }
.feed time { color: var(--gray); font: 400 12px/1.5 var(--mono); font-variant-numeric: tabular-nums; margin-right: 8px; }

/* record sheet */
dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: var(--scrim); }
.sheet { padding: 28px 28px 24px; display: grid; gap: 18px; }
.sheet h2 { margin: 0; font-weight: 400; }
.field { display: grid; gap: 6px; }
.cfg-fields { display: grid; gap: 22px; max-width: 640px; }
.cfg-row { display: flex; gap: 16px; align-items: baseline; font-size: 14px; }
.help { margin: 0; font-size: 12px; }
.field input:disabled { background: var(--bg); color: var(--gray); }
.field textarea { border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 12px 14px; background: var(--surface); width: 100%; font: inherit; resize: vertical; }
.field input[type="text"], .field input[type="password"], .field select { border: 1px solid var(--edge); border-radius: var(--r); padding: 9px 14px; background: var(--surface); min-width: 0; width: 100%; }
.seg { display: inline-flex; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--edge); border-radius: var(--r); padding: 7px 16px; cursor: pointer; }
.seg input:checked + span { font-weight: 500; }
.seg label:has(input:checked) { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { accent-color: var(--btn); }
.sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.closed { min-height: 100vh; display: grid; place-content: center; padding: 32px; max-width: 60ch; margin: 0 auto; }

@media (max-width: 860px) {
  .top { grid-template-columns: 1fr auto; padding: 12px 16px; }
  .top nav { grid-column: 1 / -1; order: 3; }
  .top .wordmark { order: 1; justify-self: start; }
  .top .right { order: 2; }
  #status:not(:empty), #detected, #upcoming-panel { padding-left: 16px; padding-right: 16px; }
  #strip { padding: 12px 16px; }
  #strip .devs { flex: 1 1 100%; }
  main { padding: 24px 16px 48px; }
  .index a { grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; }
  .index .title { font-size: 20px; letter-spacing: -0.02em; }
  .index .app, .index .date { grid-column: 2; text-align: left; font-size: 12px; }
  .meeting-title, input.rename { font-size: 28px; }
  .masthead { grid-template-columns: 1fr; gap: 8px; }
  .masthead .big-num { font-size: 44px; }
  .meta { margin-left: 0; }
  .article { grid-template-columns: 1fr; }
  .handle { display: none; }
  .body { padding-right: 0; }
  .drawer { position: static; height: auto; max-height: none; margin-top: 24px; }
  .sec { grid-template-columns: 1fr; gap: 8px; }
  .live { grid-template-columns: 1fr; }
  #upcoming-panel li { grid-template-columns: 52px 1fr; }
  #upcoming-panel li .pill { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="strip" role="region" aria-label="Recording">
  <button id="stop" aria-label="Stop recording"><span></span></button>
  <div class="now">
    <span class="lbl" id="strip-label">(Recording)</span>
    <div id="strip-clock">00:00</div>
  </div>
  <div class="devs">
    <div class="dev"><span class="lbl">Me</span><label class="sr" for="strip-mic">Microphone</label><select id="strip-mic"></select><i aria-hidden="true"><b id="lv-mic"></b></i></div>
    <div class="dev"><span class="lbl">Others</span><label class="sr" for="strip-system">Speakers or headphones</label><select id="strip-system"></select><i aria-hidden="true"><b id="lv-system"></b></i></div>
  </div>
  <div class="nav"><div class="langsw" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="pt" aria-pressed="false">PT-BR</button></div><button class="pill theme-btn">Dark</button><button class="pill" id="strip-notice" type="button">Copy notice</button><a class="pill" href="#/" id="strip-index">Index</a><a class="pill" id="strip-back" hidden>Back to recording</a></div>
</div>

<header class="top">
  <nav aria-label="Main">
    <a href="#/" id="nav-index">Meetings</a>
    <button id="nav-upcoming" aria-expanded="false" aria-controls="upcoming-panel">Upcoming</button>
    <a href="#/settings" id="nav-settings">Settings</a>
  </nav>
  <a class="wordmark" href="#/">MeTranscript</a>
  <div class="right"><div class="langsw" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="pt" aria-pressed="false">PT-BR</button></div><button class="pill ghost theme-btn">Dark</button><button class="pill rec" id="record-btn">● Record</button></div>
</header>

<section id="upcoming-panel" aria-labelledby="up-title">
  <span class="lbl" id="up-title">(Upcoming – next 24 h)</span>
  <ol id="upcoming"></ol>
</section>

<div id="detected" role="alert">

const api = async (path, opts = {}) => {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || t("Error {n}", { n: res.status }));
  return data;
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
function markdown(md) {
  let html = "", list = false;
  for (const line of md.split(/\r?\n/)) {
    const h = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (!li && list) { html += "</ul>"; list = false; }
    if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (li) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(li[1].replace(/^\[[ x]\]\s*/, ""))}</li>`; }
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}

/* ---------- routing ---------- */
function currentRoute() {
  if (location.hash === "#/settings") return { name: "settings" };
  const m = location.hash.match(/^#\/m\/([\w-]+)$/);
  return m ? { name: "meeting", id: m[1] } : { name: "index" };
}
async function route() {
  await flushNotes();
  const r = currentRoute();
  for (const [nav, name] of [["#nav-index", "index"], ["#nav-settings", "settings"]]) {
    if (r.name === name) $(nav).setAttribute("aria-current", "page"); else $(nav).removeAttribute("aria-current");
  }
  if (r.name === "index") { openId = openMeeting = null; return renderIndex(); }
  if (r.name === "settings") { openId = openMeeting = null; return renderSettings(); }
  try {
    openMeeting = await api(`/api/meetings/${r.id}`);
  } catch {
    location.hash = "#/";
    return showError(t("That meeting no longer exists."));
  }
  if (openId !== r.id) { showAllTranscript = false; draft = ""; }
  openId = r.id;
  renderMeeting();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- index ---------- */
async function loadMeetings() {
  meetings = await api("/api/meetings");
  const byAge = [...meetings].sort((a, b) => a.started_at.localeCompare(b.started_at));
  numbers = new Map(byAge.map((m, i) => [m.id, String(i + 1).padStart(2, "0")]));
}
const FILTERS = {
  all: () => true,
  week: m => Date.now() - new Date(m.started_at) < 7 * 864e5,
  next: m => m.has_next_steps,
};
async function renderIndex() {
  try { await loadMeetings(); } catch (err) { return showError(err.message); }
  const shown = meetings.filter(FILTERS[filter]);
  const pill = (key, label) => `<button class="pill ghost" data-filter="${key}" aria-pressed="${filter === key}">${label}</button>`;
  view.innerHTML = `
    <div class="head"><span class="lbl">${meetings.length === 1 ? t("(Index – 1 meeting)") : t("(Index – {n} meetings)", { n: meetings.length })}</span></div>
    <div class="filters" role="group" aria-label="${t("Filter meetings")}">${pill("all", t("All"))}${pill("week", t("This week"))}${pill("next", t("With next steps"))}</div>
    ${!meetings.length ? `<div class="empty-state"><p class="t20">${t("No meetings yet.")}</p><p class="muted">${t("Press Record to start your first one.")}</p></div>`
      : !shown.length ? `<div class="empty-state"><p class="muted">${t("No meetings match this filter.")}</p></div>`
      : `<ol class="index">${shown.map(m => `<li><a href="#/m/${m.id}" class="${m.has_summary ? "" : "no-summary"}">
          <span class="num">${numbers.get(m.id)}</span><span class="title">${esc(titleOf(m))}</span>
          <span class="app">${esc(m.app || "")}</span><span class="date">${dateOnly(m.started_at)}</span></a></li>`).join("")}</ol>`}
    `;
  view.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.filter; renderIndex(); }));
}

/* ---------- meeting article ---------- */
function mailStatus(m) {
  if (m.private) return t("Private");
  if (!m.email_configured) return "";
  if (m.email_error) return `<span class="error">${esc(t("Email not sent: {e}", { e: m.email_error }))}</span>`;
  if (m.emailed_at) return esc(t("Sent to Gmail {d}", { d: when(m.emailed_at) }));
  return "";
}
function transcriptLines(text) {
  return text.split(/\r?\n/).filter(Boolean).map(line => {
    const m = line.match(/^\[(\d{2}):(\d{2}):(\d{2})\] \*\*(.+?):\*\* (.*)$/);
    return m ? { t: `${m[1]}${m[2]}${m[3]}`, label: `${m[1]}:${m[2]}:${m[3]}`, who: m[4], text: m[5] } : { t: "", label: "", who: "", text: line };
  });
}
const seconds = t => +t.slice(0, 2) * 3600 + +t.slice(2, 4) * 60 + +t.slice(4, 6);
// Each line lasts until the next one starts, capped so a long silence does not read as speech.
function timeline(lines) {
  const timed = lines.filter(l => l.t && l.who);
  if (timed.length < 2) return "";

  const spoke = { Me: 0, Others: 0 }, blocks = timed.map((l, i) => {
    const len = Math.max(0, Math.min(20, (starts[i + 1] ?? end) - starts[i]));
    spoke[l.who] = (spoke[l.who] || 0) + len;
    return `<span class="${l.who === "Others" ? "others" : "me"}" data-t="${l.t}" style="left:${(starts[i] / end * 100).toFixed(2)}%;width:${Math.max(0.3, len / end * 100).toFixed(2)}%" title="${l.label} ${esc(l.who)}"></span>`;
  }).join("");
  const total = spoke.Me + spoke.Others || 1, me = Math.round(spoke.Me / total * 100);
  return `<div class="tl"><div class="tl-bar" role="img" aria-label="${esc(t("Who spoke when: Me {a}%, Others {b}%", { a: me, b: 100 - me }))}">${blocks}</div>
    <div class="tl-share" aria-hidden="true">Me ${me}% · Others ${100 - me}%</div></div>`;
}
function renderTranscript() {
  const lines = transcriptLines(openMeeting.transcript);
  if (!lines.length) return `<p class="muted">${t("No transcript.")}</p>`;
  const visible = showAllTranscript ? lines : lines.slice(0, 20);
  return `${timeline(lines)}<div class="transcript t14">${visible.map(l => `<p${l.t ? ` id="t-${l.t}"` : ""}${l.who === "Others" ? ' class="others"' : ""}>${l.label ? `<time>${l.label}</time>` : ""}${l.who ? `<span class="who">${esc(l.who)}</span>` : ""}${esc(l.text)}</p>`).join("")}</div>
    ${lines.length > 20 && !showAllTranscript ? `<button class="link" id="show-all">${t("Show all {n} lines", { n: lines.length })}</button>` : ""}`;
}

function renderMeeting() {

        <div class="meta">${meta.map(x => `<span>${x}</span>`).join("")}</div>

          <div class="reading">${summary ? markdown(summary)

          ${m.private ? "" : `<div class="actions">
            <button class="pill dark" id="regen" ${off}>${m.summary ? t("Regenerate") : t("Generate summary")}</button>
            ${m.can_undo ? `<button class="pill ghost" id="undo" ${off}>${t("Undo")}</button>` : ""}
            ${m.has_audio ? `<button class="pill ghost" id="retranscribe" ${off} title="${t("Transcribe the saved audio again, then rewrite the summary")}">${t("Re-transcribe")}</button>` : ""}
            ${m.email_configured ? `<button class="pill ghost" id="mail" ${off || !m.summary ? "disabled" : ""}>${t("Email it to me")}</button>` : ""}
            <span class="msg" id="doc-msg" aria-live="polite"></span></div>`}
        </div></section>
        ${nextSteps ? `<section class="sec" aria-labelledby="s2"><span class="lbl" id="s2">${t("(02) Next steps")}</span><div class="reading">${markdown(nextSteps)}</div></section>` : ""}
        <section class="sec" aria-labelledby="s3"><span class="lbl" id="s3"><label for="notes">${t("(03) Notes")}</label></span><div>
          <textarea class="notes" id="notes" placeholder="${t("Your notes for this meeting")}"></textarea><span class="saved" aria-live="polite"></span>
        </div></section>
        <section class="sec" aria-labelledby="s4"><span class="lbl" id="s4">${t("(04) Transcript")}</span><div id="transcript">${renderTranscript()}</div></section>

      <section class="drawer" aria-labelledby="chat-title">
        <header><span class="lbl" id="chat-title">${t("(Ask this meeting)")}</span></header>
        <p class="privacy">${m.private ? t("Private meeting: chat is off and nothing is sent to the AI or by email.")
          : `${t("Before anything goes to DeepSeek, names, contacts and values are swapped for codes and put back in the answer.")}${m.protected ? t(" Hidden so far: {n}.", { n: m.protected }) : ""}`}</p>
        <div class="chat-log" id="chat-log">${chatLog()}</div>
        <form class="chat-form" id="chat-form">
          <label class="sr" for="chat-input">${t("Message")}</label>

          <button class="pill dark" ${off}>${t("Send")}</button>
          <span id="chat-msg" aria-live="polite"></span>

  $("#regen")?.addEventListener("click", () => docAction("summary", t("Writing the summary…"), t("Summary generated.")));
  $("#undo")?.addEventListener("click", () => docAction("undo", "", t("Previous version restored.")));
  $("#retranscribe")?.addEventListener("click", async e => {
    e.target.disabled = true;
    try { await api(`/api/meetings/${openId}/retranscribe`, { method: "POST" }); await poll(); }
    catch (err) { e.target.disabled = false; $("#doc-msg").innerHTML = `<span class="error">${esc(err.message)}</span>`; }
  });
  $("#mail")?.addEventListener("click", () => docAction("email", t("Sending…"), t("Sent to your email.")));
  $("#rename").addEventListener("click", startRename);
  $("#delete").addEventListener("click", () => {
    $("#confirm-text").textContent = t("“{t}” and its notes, transcript, summary and chat will be removed from this computer. This can't be undone.", { t: titleOf(openMeeting) });

function bindTranscript() {
  $(".tl-bar")?.addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (b) jumpTo(b.dataset.t); });
  $("#show-all")?.addEventListener("click", () => { showAllTranscript = true; $("#transcript").innerHTML = renderTranscript(); bindTranscript(); });
}
function jumpTo(t) {
  if (!showAllTranscript) { showAllTranscript = true; $("#transcript").innerHTML = renderTranscript(); bindTranscript(); }
  const lines = [...document.querySelectorAll(".transcript p[id]")];
  const target = lines.filter(p => p.id.slice(2) <= t).pop() || lines[0];
  if (!target) return;
  target.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  target.classList.add("hit");
  setTimeout(() => target.classList.remove("hit"), 2000);
}

/* ---------- chat ---------- */
function chatLog() {
  const m = openMeeting;
  if (!m.chat.length && waiting !== m.id) {
    return m.private ? "" : `<p class="muted t14">${t("Ask something specific, like “What deadline did John give?”, or request a change, like “Make it shorter”.")}</p>`;
  }
  return m.chat.map((c, i) => c.role === "user"
    ? `<div class="msg me"><p>${esc(c.content)}</p></div>`
    : `<div class="msg bot">${withTimeLinks(markdown(c.content))}${c.changed_summary
        ? `<small>${t("Summary updated")}</small>` : `<button class="link t12" data-include="${i}">${t("Add to summary")}</button>`}</div>`
  ).join("") + (waiting === m.id ? `<div class="msg bot"><p class="muted">${t("Thinking…")}</p></div>` : "");
}
function bindChat() {
  const input = $("#chat-input"), log = $("#chat-log");
  input.value = draft;
  input.addEventListener("input", () => { draft = input.value; });
  $("#chat-form").addEventListener("submit", e => { e.preventDefault(); send(input.value, true); });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value, true); } });
  log.addEventListener("click", e => {
    const t = e.target.closest("a[data-t]");
    if (t) { e.preventDefault(); return jumpTo(t.dataset.t); }
    const b = e.target.closest("button[data-include]");
    if (b) send(`Add this to the summary: ${openMeeting.chat[b.dataset.include].content.slice(0, 3500)}`, false);
  });
  log.scrollTop = log.scrollHeight;
}
async function send(text, typed) {
  text = text.trim();
  if (!text || waiting) return;
  const id = openId;
  waiting = id;
  if (typed) draft = "";
  openMeeting.chat.push({ role: "user", content: text });
  renderMeeting();
  try {
    const m = await api(`/api/meetings/${id}/chat`, { method: "POST", body: JSON.stringify({ message: text }) });
    waiting = null;
    if (openId !== id) return;
    openMeeting = m;
    renderMeeting();
    $("#chat-input")?.focus();
  } catch (err) {
    waiting = null;
    if (typed) draft = text;
    if (openId !== id) return;
    openMeeting.chat.pop();
    renderMeeting();
    $("#chat-msg").innerHTML = `<span class="error">${esc(err.message)}</span>`;
  }
}
function startRename() {
  const h1 = $(".meeting-title"), id = openId;
  const input = document.createElement("input");
  input.className = "rename";
  input.maxLength = 200;
  input.value = openMeeting.title;
  input.setAttribute("aria-label", t("Meeting title"));
  h1.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    if (save && input.value.trim() !== openMeeting.title) {
      try {
        await flushNotes();
        const m = await api(`/api/meetings/${id}/title`, { method: "PUT", body: JSON.stringify({ title: input.value }) });
        if (openId === id) openMeeting = m;
      } catch (err) { showError(err.message); }
    }
    if (openId === id) renderMeeting();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", () => finish(true));
}

const confirmDialog = $("#confirm");
$("#confirm-cancel").addEventListener("click", () => confirmDialog.close());
$("#confirm-form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = openId;
  try {
    await api(`/api/meetings/${id}`, { method: "DELETE" });
    confirmDialog.close();
    dirty = null;

    showInfo(t("Meeting deleted."));
  } catch (err) {

});

async function docAction(action, label, done) {
  const id = openId;
  waiting = id;
  renderMeeting();
  $("#doc-msg").textContent = label;
  try {
    await flushNotes();
    const m = await api(`/api/meetings/${id}/${action}`, { method: "POST" });
    waiting = null;
    if (openId === id) { openMeeting = m; renderMeeting(); $("#doc-msg").textContent = done; }
  } catch (err) {
    waiting = null;
    if (openId !== id) return;
    openMeeting = await api(`/api/meetings/${id}`).catch(() => openMeeting);
    renderMeeting();
    $("#doc-msg").innerHTML = `<span class="error">${esc(err.message)}</span>`;

}

/* ---------- theme ---------- */
function applyTheme(dark, save = true) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  for (const b of document.querySelectorAll(".theme-btn")) {
    b.textContent = dark ? t("Light") : t("Dark");
    b.setAttribute("aria-label", dark ? t("Switch to the light theme") : t("Switch to the dark theme"));
  }
  if (save) { try { localStorage.setItem("metranscript.theme", dark ? "dark" : "light"); } catch { /* storage may be blocked */ } }
}
document.querySelectorAll(".theme-btn").forEach(b => b.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme !== "dark")));

/* ---------- resizable drawer ---------- */
const DRAWER_KEY = "metranscript.drawerWidth", DRAWER_MIN = 320;
const drawerDefault = () => Math.round(Math.min(520, Math.max(380, innerWidth * 0.26)));
const drawerMax = () => Math.min(innerWidth * 0.5, 640);
function setDrawer(px, save = true) {
  const w = Math.round(Math.min(drawerMax(), Math.max(DRAWER_MIN, px)));
  document.documentElement.style.setProperty("--drawer", `${w}px`);
  $("#handle")?.setAttribute("aria-valuenow", w);
  if (save) { try { localStorage.setItem(DRAWER_KEY, w); } catch { /* storage may be blocked */ } }
}
function bindHandle() {
  const h = $("#handle");
  h.setAttribute("aria-valuemin", DRAWER_MIN);
  h.setAttribute("aria-valuemax", Math.round(drawerMax()));
  h.setAttribute("aria-valuenow", parseInt(getComputedStyle(document.documentElement).getPropertyValue("--drawer")));
  h.addEventListener("pointerdown", e => {
    h.setPointerCapture(e.pointerId);
    const move = ev => setDrawer(innerWidth - ev.clientX - (innerWidth - h.parentElement.getBoundingClientRect().right));
    h.addEventListener("pointermove", move);
    h.addEventListener("pointerup", () => h.removeEventListener("pointermove", move), { once: true });
  });
  h.addEventListener("dblclick", () => setDrawer(drawerDefault()));
  h.addEventListener("keydown", e => {
    const step = { ArrowLeft: 16, ArrowRight: -16 }[e.key];
    if (step) { e.preventDefault(); setDrawer(parseInt(h.getAttribute("aria-valuenow")) + step); }
  });
}
try { const saved = parseInt(localStorage.getItem(DRAWER_KEY)); if (saved) setDrawer(saved, false); } catch { /* storage may be blocked */ }

/* ---------- notes autosave ---------- */
let dirty = null, saveTimer = null, saveFailed = false;
const savedLabel = text => { const el = $(".saved"); if (el) el.textContent = text; };
function bindNotes(textarea, id) {
  if (saveFailed) savedLabel(t("Not saved. Retrying…"));
  textarea.addEventListener("input", () => {
    dirty = { id, notes: textarea.value };
    if (openMeeting?.id === id) openMeeting.notes = textarea.value;
    savedLabel(t("Saving…"));
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushNotes, 700);
  });
}
async function flushNotes(keepalive = false) {
  clearTimeout(saveTimer);
  if (!dirty) return;
  const d = dirty;
  dirty = null;
  try {
    await api(`/api/meetings/${d.id}/notes`, { method: "PUT", keepalive, body: JSON.stringify({ notes: d.notes }) });
    saveFailed = false;
    if (!dirty) savedLabel(t("Saved"));
  } catch (err) {
    dirty ??= d;
    saveFailed = true;
    savedLabel(t("Not saved ({e}). Retrying…", { e: err.message }));
    saveTimer = setTimeout(flushNotes, 3000);
  }
}
window.addEventListener("beforeunload", e => {
  if (!dirty) return;
  const failed = saveFailed;
  flushNotes(true);
  if (failed) e.preventDefault();
});

/* ---------- live view ---------- */
function renderLive() {
  view.innerHTML = `
    <div class="live">
      <section><label class="lbl" for="notes">${t("(Your notes)")}</label><textarea class="notes" id="notes" style="margin-top:8px; min-height:320px" placeholder="${t("Jot down what matters to you. The summary gives these points more weight.")}"></textarea><span class="saved" aria-live="polite"></span></section>
      <section><span class="lbl">${t("(Live transcript – updates every ~30 s)")}</span><div class="feed" id="feed" style="margin-top:8px"><p class="muted">${t("The first part shows up in about 30 seconds.")}</p></div></section>
    </div>`;
  const ta = $("#notes");
  ta.value = openMeeting.notes;
  bindNotes(ta, openMeeting.id);
  renderFeed();
}
function renderFeed() {
  const feed = $("#feed");
  if (!feed || !status.segments?.length) return;
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  feed.innerHTML = status.segments.map(s => `<p${s.who === "Others" ? ' class="others"' : ""}><time>${clock(s.t)}</time><span class="who">${esc(s.who)}</span>${esc(s.text)}</p>`).join("");
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}

/* ---------- devices ---------- */
let deviceList = { mics: [], speakers: [] };
function fillDevices(select, list, keepChoice, current) {
  const keep = current || (keepChoice ? select.value : "");
  select.replaceChildren(...list.map(d => {
    const o = document.createElement("option");
    o.value = d.name;
    o.textContent = d.default ? t("{d} (default)", { d: d.name }) : d.name;
    o.selected = keep ? d.name === keep : d.default;
    return o;
  }));
}
// Every recording starts from the Windows defaults; only "Refresh devices" keeps the current pick.
async function loadDevices(keepChoice = false) {
  try { deviceList = await api("/api/devices"); } catch (err) { return showError(t("Could not list audio devices: {e}", { e: err.message })); }
  fillDevices($("#dev-mic"), deviceList.mics, keepChoice);
  fillDevices($("#dev-system"), deviceList.speakers, keepChoice);
}
$("#dev-refresh").addEventListener("click", () => loadDevices(true));
for (const track of ["mic", "system"]) {
  $(`#strip-${track}`).addEventListener("change", async e => {
    if (status.phase !== "recording") return;
    try {
      await api("/api/devices", { method: "POST", body: JSON.stringify({ track, name: e.target.value }) });
      showInfo(t(track === "mic" ? "Now recording your voice from {d}." : "Now recording the call from {d}.", { d: e.target.value }));
    } catch (err) {
      showError(err.message);
      e.target.value = status.devices?.[track] ?? e.target.value;
    }
  });
}

/* ---------- record sheet ---------- */
const sheet = $("#sheet");
let sheetPrefill = {};
const NOTICE = "This meeting is being recorded and transcribed for personal notes. / Esta reunião está sendo gravada e transcrita para anotações pessoais.";
async function copyNotice(show) {
  try { await navigator.clipboard.writeText(NOTICE); show(t("Notice copied. Paste it in the meeting chat.")); }
  catch { show(t("Could not copy the notice.")); }
}
$("#copy-notice").addEventListener("click", () => copyNotice(msg => { $("#notice-msg").textContent = msg; }));
$("#strip-notice").addEventListener("click", () => copyNotice(showInfo));
async function openRecordSheet(prefill = {}) {
  if (BUSY.includes(status.phase)) return showError(t("A recording is already in progress."));
  sheetPrefill = prefill;
  $("#title").value = prefill.title || "";
  $("#sheet-msg").textContent = "";
  $("#notice-msg").textContent = "";
  $("#consent").checked = false;
  sheet.showModal();
  $("#title").focus();
  await loadDevices();
}
$("#sheet-cancel").addEventListener("click", () => sheet.close());
$("#sheet-form").addEventListener("submit", async e => {
  e.preventDefault();
  const ok = await startRec({ title: $("#title").value, app: sheetPrefill.app, reminder: sheetPrefill.reminder, consent: $("#consent").checked,
    lang: document.querySelector('input[name="lang"]:checked').value,
    mic: $("#dev-mic").value, speakers: $("#dev-system").value });
  if (ok) sheet.close();
});
async function startRec(body) {
  notice = null;
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  try {
    const { id } = await api("/api/start", { method: "POST", body: JSON.stringify(body) });
    recordingId = id;
    await poll();
    location.hash = `#/m/${id}`;
    return true;
  } catch (err) {
    if (sheet.open) $("#sheet-msg").textContent = err.message; else showError(err.message);
    return false;
  }
}
$("#record-btn").addEventListener("click", () => openRecordSheet());
$("#stop").addEventListener("click", async () => {
  await flushNotes();
  notice = null;
  try { await api("/api/stop", { method: "POST" }); await poll(); } catch (err) { showError(err.message); }
});

/* ---------- status polling ---------- */
let polling = null;
const poll = () => polling ??= refresh().finally(() => { polling = null; });
async function refresh() {
  try { status = await api("/api/status"); } catch { statusEl.textContent = t("Cannot reach MeTranscript. Is the program running?"); return; }
  const p = status.phase, rec = p === "recording", busy = BUSY.includes(p);
  document.body.classList.toggle("recording", busy);
  document.body.classList.toggle("on-air", rec);
  document.title = rec ? `● ${clock(status.elapsed || 0)} MeTranscript` : "MeTranscript";
  if (busy) {
    recordingId = status.meeting_id;
    const m = meetings.find(x => x.id === status.meeting_id) || (openMeeting?.id === status.meeting_id ? openMeeting : null);
    $("#strip-label").textContent = rec ? t("(Recording – {t})", { t: m ? titleOf(m) : t("meeting") })
      : p === "transcribing" ? t("(Finishing the transcript…)") : t("(Writing the summary…)");
    $("#strip-clock").textContent = clock(status.elapsed || 0);
    $("#stop").disabled = !rec;
    $("#lv-mic").style.width = Math.min(100, status.levels.mic * 100) + "%";
    $("#lv-system").style.width = Math.min(100, status.levels.system * 100) + "%";
    const onIt = openId === status.meeting_id;
    $("#strip-back").hidden = onIt;
    $("#strip-back").href = `#/m/${status.meeting_id}`;
    if (rec && status.devices) {
      if (prevPhase !== "recording" || !$("#strip-mic").options.length) {
        if (!deviceList.mics.length) { try { deviceList = await api("/api/devices"); } catch { /* shown on next action */ } }
        fillDevices($("#strip-mic"), deviceList.mics, false, status.devices.mic);
        fillDevices($("#strip-system"), deviceList.speakers, false, status.devices.system);
      }
      for (const [track, name] of Object.entries(status.devices)) {
        const sel = $(`#strip-${track}`);
        if (document.activeElement !== sel && sel.value !== name) sel.value = name;
      }
    }
  }
  if (prevPhase !== p) notice = null;
  statusEl.innerHTML = notice ?? (status.error ? `<span class="error">${esc(status.error)}</span>` : "");
  if (rec && openId === status.meeting_id) {
    if (!$("#feed")) renderLive();
    renderFeed();
  }
  const finished = BUSY.includes(prevPhase) && !busy;
  if (prevPhase !== p && openId === status.meeting_id && openId && !finished) {
    await flushNotes();
    openMeeting = await api(`/api/meetings/${openId}`).catch(() => openMeeting);
    renderMeeting();
  }
  if (finished && recordingId) {
    const id = recordingId;
    recordingId = null;
    if (location.hash === `#/m/${id}`) route(); else location.hash = `#/m/${id}`;
  }
  if (currentRoute().name === "index" && prevPhase !== p) renderIndex();
  prevPhase = p;
  showDetected();
}

/* ---------- meeting detected ---------- */
const seen = new Set();
let shownKey = null;
$("#detected-rec").addEventListener("click", () => { $("#detected").classList.remove("show"); openRecordSheet({ app: status.detected?.app }); });
$("#detected-dismiss").addEventListener("click", () => { seen.add(status.detected?.key); $("#detected").classList.remove("show"); });
function showDetected() {
  const d = status.detected;
  if (d && status.phase === "recording") seen.add(d.key);
  const show = !!d && !seen.has(d.key) && !BUSY.includes(status.phase);
  $("#detected").classList.toggle("show", show);
  if (!show || shownKey === d.key) return;
  shownKey = d.key;
  $("#detected-text").textContent = t("{app} is using the microphone. Did a meeting start?", { app: d.app });
  if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
    const n = new Notification("MeTranscript", { body: t("{app} is using the microphone. Record this meeting?", { app: d.app }) });
    n.onclick = () => { window.focus(); n.close(); };
  }
}

/* ---------- upcoming (calendar) ---------- */
let agenda = { configured: false, events: [], error: null };
async function loadAgenda() {
  if (closed) return;
  try { agenda = await api("/api/agenda"); } catch { return; }
  $("#nav-upcoming").textContent = agenda.events.length ? t("Upcoming ({n})", { n: agenda.events.length }) : t("Upcoming");
  $("#upcoming").innerHTML = !agenda.configured
    ? `<li><span></span><span class="muted">${t("Add your calendar address in {link} to get reminders 30 and 2 minutes before meetings.", { link: `<a href="#/settings">${t("Settings")}</a>` })}</span></li>`
    : agenda.error ? `<li><span></span><span class="error">${esc(agenda.error)}</span></li>`
    : agenda.events.length ? agenda.events.map((e, i) => `<li><span class="time">${timeOf(e.start)}</span><span>${esc(e.title)} <span class="muted">${esc(e.app)}</span></span><button class="pill ghost" data-event="${i}">${t("Record")}</button></li>`).join("")
    : `<li><span></span><span class="muted">${t("No meetings with a video link in the next 24 hours.")}</span></li>`;
}
$("#nav-upcoming").addEventListener("click", e => {
  const open = $("#upcoming-panel").classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", open);
});
$("#upcoming").addEventListener("click", e => {
  const b = e.target.closest("button[data-event]");
  if (!b) return;
  const ev = agenda.events[b.dataset.event];
  $("#upcoming-panel").classList.remove("open");
  $("#nav-upcoming").setAttribute("aria-expanded", "false");
  openRecordSheet({ title: ev.title, app: ev.app });
});

/* ---------- settings / quit ---------- */
function bindSettings() {
  const box = $("#autostart");
  api("/api/settings").then(s => { box.checked = s.autostart; }).catch(() => {});
  box.addEventListener("change", async e => {
    try { e.target.checked = (await api("/api/settings", { method: "POST", body: JSON.stringify({ autostart: e.target.checked }) })).autostart; }
    catch (err) { e.target.checked = !e.target.checked; showError(err.message); }
  });
  $("#quit").addEventListener("click", async () => {
    try {
      await flushNotes();
      await api("/api/quit", { method: "POST" });
      closed = true;
      document.body.innerHTML = `<div class="closed"><p class="t28">${t("MeTranscript is closed")}</p><p class="muted">${t("Start it again at the next Windows sign-in (if enabled) or with")} <code style="white-space:nowrap">python -m metranscript.server</code>.</p></div>`;
    } catch (err) { showError(err.message); }
  });
}


/* ---------- settings ---------- */
const SETTINGS = [
  { num: "(01) AI summaries", fields: [
    { name: "DEEPSEEK_API_KEY", label: "DeepSeek API key", secret: true, help: "Used for summaries and chat. Create a key at platform.deepseek.com." }] },
  { num: "(02) Gmail", testEmail: true, fields: [
    { name: "GMAIL_ADDRESS", label: "Gmail address", secret: false },
    { name: "GMAIL_APP_PASSWORD", label: "App password", secret: true,
      help: "Turn on 2-Step Verification in your Google Account, then create an app password at myaccount.google.com/apppasswords." }] },
  { num: "(03) Calendar", fields: [
    { name: "GOOGLE_CALENDAR_ICS", label: "Secret address in iCal format", secret: true,
      help: "Google Calendar → Settings → your calendar → Integrate calendar. Treat this address like a password." }] },
  { num: "(04) Meeting alert", fields: [
    { name: "MEETING_KEYWORDS", label: "Browser window words", secret: false,
      help: "A browser using the microphone only raises the alert when one of its window titles has one of these comma-separated words. Default: Meet, Zoom, Teams." }] },
  { num: "(05) Retention", fields: [
    { name: "AUDIO_KEEP_DAYS", label: "Keep audio for (days)", secret: false,
      help: "Compressed audio is kept only so you can re-transcribe. 0 deletes it as soon as the transcript is ready. Default: 30." },
    { name: "MEETING_KEEP_DAYS", label: "Delete whole meetings after (days)", secret: false,
      help: "Leave empty to keep meetings until you delete them. Otherwise each meeting, with its notes, transcript and summary, is deleted this many days after it ends." }] },
];
const stateText = f => t(f.locked ? "Set by a Windows environment variable" : f.set ? (f.value === null ? "Saved" : "Set") : "Not set");

async function renderSettings() {
  let cfg, terms;
  try { [cfg, { terms }] = await Promise.all([api("/api/config"), api("/api/privacy")]); } catch (err) { return showError(err.message); }
  const field = d => {
    const f = cfg[d.name];
    return `<div class="field">
      <label class="lbl" for="cfg-${d.name}">${t(d.label)}</label>
      <input id="cfg-${d.name}" data-name="${d.name}" type="${d.secret ? "password" : "text"}" autocomplete="${d.secret ? "new-password" : "off"}"
        spellcheck="false" placeholder="${f.set ? (d.secret ? t("Saved. Type a new value to replace it") : "") : t("Not set")}"
        value="${d.secret ? "" : esc(f.value || "")}" ${f.locked ? "disabled" : ""}>
      <div class="cfg-row"><span class="${f.set ? "" : "muted"}">${stateText(f)}</span>
        ${f.set && !f.locked ? `<button type="button" class="link danger" data-remove="${d.name}">${t("Remove")}</button>` : ""}</div>
      ${d.help ? `<p class="muted help">${t(d.help)}</p>` : ""}</div>`;
  };
  view.innerHTML = `
    <div class="head"><span class="lbl">${t("(Settings)")}</span></div>
    <h1 class="meeting-title">${t("Settings")}</h1>
    <p class="muted" style="max-width:60ch">${t("Keys are stored only in the .env file on this computer. This page never shows them back.")}</p>
    <form id="cfg-form" autocomplete="off">
      ${SETTINGS.map(s => `<section class="sec"><span class="lbl">${t(s.num)}</span><div class="cfg-fields">${s.fields.map(field).join("")}
        ${s.testEmail ? `<div class="actions"><button type="button" class="pill ghost" id="test-email" ${cfg.GMAIL_ADDRESS.set && cfg.GMAIL_APP_PASSWORD.set ? "" : "disabled"}>${t("Send a test email")}</button></div>` : ""}</div></section>`).join("")}
      <div class="actions" style="margin: 8px 0 32px"><button class="pill dark" id="cfg-save">${t("Save settings")}</button></div>
    </form>
    <section class="sec"><span class="lbl">${t("(06) Protected terms")}</span><div class="cfg-fields">
      <form id="terms-form"><div class="field">
        <label class="lbl" for="terms">${t("Names, clients and projects to hide")}</label>
        <textarea id="terms" rows="8" spellcheck="false" placeholder="${t("One per line, for example a client or project name")}">${esc(terms.join("\n"))}</textarea>
        <p class="muted help">${t("Each one is replaced by a code before anything goes to DeepSeek and put back in the answer. Emails, links, phone and ID numbers, money amounts and keys are always hidden, with no need to list them. A single word that Whisper misspells is caught too. The list stays in sensitive-terms.txt on this computer.")}</p></div>
        <div class="actions"><button class="pill dark" id="terms-save">${t("Save terms")}</button></div></form></div></section>
    <section class="sec"><span class="lbl">${t("(07) App")}</span><div class="settings">
      <label><input type="checkbox" id="autostart"> ${t("Run in background and start with Windows")}</label>
      <button class="link" id="quit">${t("Quit MeTranscript")}</button></div></section>`;
  $("#cfg-form").addEventListener("submit", async e => {
    e.preventDefault();
    const updates = {};
    for (const input of view.querySelectorAll("input[data-name]")) {
      const v = input.value.trim(), f = cfg[input.dataset.name];
      if (!input.disabled && v && v !== (f.value || "")) updates[input.dataset.name] = v;
    }
    if (!Object.keys(updates).length) return showInfo(t("Nothing to save."));
    try { await api("/api/config", { method: "PUT", body: JSON.stringify(updates) }); await renderSettings(); showInfo(t("Settings saved.")); }
    catch (err) { showError(err.message); }
  });
  $("#terms-form").addEventListener("submit", async e => {
    e.preventDefault();
    try { await api("/api/privacy", { method: "PUT", body: JSON.stringify({ terms: $("#terms").value }) }); await renderSettings(); showInfo(t("Terms saved.")); }
    catch (err) { showError(err.message); }
  });
  view.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", async () => {
    try { await api("/api/config", { method: "PUT", body: JSON.stringify({ [b.dataset.remove]: null }) }); await renderSettings(); showInfo(t("Removed.")); }
    catch (err) { showError(err.message); }
  }));
  $("#test-email")?.addEventListener("click", async e => {
    e.target.disabled = true;
    showInfo(t("Sending the test email…"));
    try { await api("/api/config/test-email", { method: "POST" }); showInfo(t("Test email sent. Check your inbox.")); }
    catch (err) { showError(err.message); }
    e.target.disabled = false;
  });
  bindSettings();
}

document.querySelectorAll(".langsw button").forEach(b => b.addEventListener("click", async () => {
  if (b.dataset.lang === uiLang) return;
  uiLang = b.dataset.lang;
  applyLang();
  await route();
  loadAgenda();
  poll();
}));

/* ---------- start ---------- */
(async function boot() {
  applyLang(false);
  await loadMeetings().catch(() => {});
  await route();
  loadAgenda();
  setInterval(loadAgenda, 60000);
  (async function loop() { if (closed) return; await poll(); setTimeout(loop, 1000); })();
  const reminderToken = new URLSearchParams(location.search).get("record");
  if (reminderToken) {
    history.replaceState(null, "", "/" + location.hash);
    openRecordSheet({ reminder: reminderToken });
  }
})();
</script>
</body>
</html>
