@font-face {
  font-family: "Hanken Grotesk"; font-weight: 400 500; font-display: swap;
  src: url(/fonts/hanken-grotesk-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Hanken Grotesk"; font-weight: 400 500; font-display: swap;
  src: url(/fonts/hanken-grotesk-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "JetBrains Mono"; font-weight: 300 500; font-display: swap;
  src: url(/fonts/jetbrains-mono-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root {
  --bg: #FBF8F3;
  --surface: #FFFDF9;
  --ink: #1A1613;
  --gray: #6B635A;
  --line: #E7E2DA;
  --edge: #8C8378;
  --pill: #EDE6DA;
  --dark: #1F1A16;
  --btn: #1F1A16;
  --on-btn: #FBF8F3;
  --rec: #C8412F;
  --rec-bg: #C8412F;
  --scrim: rgba(24, 24, 24, .35);
  --font: "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 4px;
  --r-lg: 6px;
  --drawer: clamp(380px, 26vw, 520px);
}
/* --dark stays a dark surface (record strip, detected banner); --btn is what buttons and the user bubble use, so it inverts. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141311;
  --surface: #1D1B18;
  --ink: #EFEBE4;
  --gray: #A39E95;
  --line: #34312C;
  --edge: #6F685F;
  --pill: #2A2723;
  --dark: #26231F;
  --btn: #EFEBE4;
  --on-btn: #1A1613;
  --rec: #EC6B55;
  --scrim: rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); min-height: 100vh; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
::selection { background: var(--ink); color: var(--bg); }
input, textarea { caret-color: var(--rec); }
* { scrollbar-color: var(--edge) transparent; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* type scale: 12 / 14 / 16 / 20 / 28 / 40 */
.t12, .lbl { font-size: 12px; }
.t20 { font-size: 20px; letter-spacing: -0.02em; line-height: 1.25; }
.t28 { font-size: 28px; letter-spacing: -0.03em; line-height: 1.12; }
.lbl, .muted { color: var(--gray); }
.error { color: var(--rec); }

/* pills */
.pill { border: 1px solid transparent; border-radius: var(--r); padding: 7px 16px; background: var(--pill); font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pill:hover { filter: brightness(.96); }
.pill.dark { background: var(--btn); color: var(--on-btn); }
.pill.rec { background: var(--rec-bg); color: #fff; border-radius: 999px; }
.pill.ghost { background: transparent; border-color: var(--edge); }
.pill[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.pill:disabled { opacity: .45; cursor: default; filter: none; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 14px 32px; background: var(--bg); border-bottom: 1px solid var(--ink); }
.top nav { display: flex; gap: 20px; }
.top nav a, .top nav button { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; font-size: 14px; }
.top nav [aria-current="page"], .top nav [aria-expanded="true"] { text-decoration: underline; text-underline-offset: 5px; }
.wordmark { font-weight: 500; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
.top .right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.langsw { display: inline-flex; border: 1px solid var(--edge); border-radius: var(--r); overflow: hidden; }
.langsw button { background: none; border: 0; padding: 6px 10px; cursor: pointer; font: 400 12px/1.5 var(--mono); color: var(--gray); }
.langsw button + button { border-left: 1px solid var(--edge); }
.langsw button[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); }
#strip .langsw { border-color: rgba(255,255,255,.35); }
#strip .langsw button { color: #C9C9C9; }
#strip .langsw button + button { border-left-color: rgba(255,255,255,.35); }
#strip .langsw button[aria-pressed="true"] { background: #fff; color: #1A1613; }
body.recording .top { display: none; }

/* status line */
#status { padding: 0 32px; min-height: 0; }
#status:not(:empty) { padding: 10px 32px; border-bottom: 1px solid var(--line); background: var(--surface); }

/* meeting detected */
#detected { display: none; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 32px; background: var(--dark); color: #fff; }
#detected.show { display: flex; }
#detected p { margin: 0; flex: 1 1 260px; }
#detected .pill { background: #fff; color: #181818; }
#detected .pill.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }

/* upcoming panel */
#upcoming-panel { display: none; padding: 20px 32px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
#upcoming-panel.open { display: block; }
#upcoming-panel ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 0; max-width: 760px; }
#upcoming-panel li { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
#upcoming-panel .time { font: 400 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; }

/* recording strip */
#strip { display: none; position: sticky; top: 0; z-index: 6; background: var(--dark); color: #fff; border-top: 2px solid var(--rec); border-bottom: 1px solid rgba(255,255,255,.1); padding: 12px 32px; gap: 20px; align-items: center; flex-wrap: wrap; }
body.recording #strip { display: flex; }
#strip .lbl { color: #C9C9C9; }
#stop { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none; }
#stop span { width: 14px; height: 14px; border-radius: 3px; background: var(--rec); }
#stop:disabled { opacity: .4; cursor: default; }
#strip .now { min-width: 0; flex: 1 1 220px; }
#strip .now .lbl { display: block; overflow-wrap: anywhere; }
#strip-clock { font: 400 40px/1.05 var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.1; }
#strip .devs { display: grid; gap: 6px; font-size: 12px; min-width: 0; flex: 0 1 360px; }
#strip .dev { display: grid; grid-template-columns: 64px minmax(0, 1fr) 96px; gap: 8px; align-items: center; }
#strip .dev .lbl::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: var(--meter); }
#strip .dev:nth-child(1) { --meter: #EFEBE4; }
#strip .dev:nth-child(2) { --meter: #D39A52; }
body.on-air #strip-label::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--rec); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
#strip select { min-width: 0; width: 100%; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: var(--r); padding: 3px 8px; font-size: 12px; }
#strip select option { color: var(--ink); background: var(--surface); }
#strip i { height: 14px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 3px, transparent 3px 6px); overflow: hidden; display: block; }
#strip i b { display: block; height: 100%; width: 0; background: var(--meter); transition: width .12s linear; -webkit-mask: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 6px); mask: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 6px); }
#strip .nav { display: flex; gap: 8px; }
#strip .pill { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }

/* about */
.about { max-width: 1280px; margin: 0 auto; }
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 72px); align-items: center; padding: 40px 0 88px; }
.hero h1 { font-size: clamp(40px, 6vw, 80px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 400; margin: 0 0 22px; text-wrap: balance; }
.lead { font-size: 18px; line-height: 1.55; max-width: 46ch; margin: 0; }
.cta { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-top: 30px; }
.pill.big { padding: 13px 28px; font-size: 16px; }
.frame { border: 1px solid var(--edge); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); box-shadow: 0 44px 80px -44px rgba(26, 22, 19, .45); }
.frame img { display: block; width: 100%; height: auto; }
.hero .frame { margin-right: calc(-1 * clamp(16px, 3vw, 56px)); animation: rise .8s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.about-sec { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; padding: 40px 0; border-top: 1px solid var(--line); }
.about-title { margin: 0 0 8px; font-weight: 400; font-size: 28px; letter-spacing: -0.03em; line-height: 1.12; }
.step { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; padding: 48px 0; border-top: 1px solid var(--line); }
.step .num { font: 300 72px/.85 var(--mono); letter-spacing: -0.04em; }
.step h2 { margin: 0 0 10px; font-weight: 400; font-size: 28px; letter-spacing: -0.03em; line-height: 1.12; }
.step p { margin: 0 0 22px; max-width: 62ch; font-size: 16px; line-height: 1.6; }
.step .pair { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 36px; align-items: start; }
.facts { display: grid; margin-top: 8px; border-top: 1px solid var(--ink); }
.fact { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.fact b { font-weight: 500; }
.fact span { max-width: 62ch; line-height: 1.55; }
.about-note { max-width: 62ch; margin: 22px 0 14px; line-height: 1.6; }
.about-note.first { margin-top: 0; }
.about-how { display: block; margin-bottom: 6px; }
.about-end { padding: 72px 0 24px; border-top: 1px solid var(--ink); }
.about-end h2 { margin: 0 0 6px; font-weight: 400; font-size: clamp(32px, 4.5vw, 56px); letter-spacing: -0.035em; line-height: 1.05; }
.policy { max-width: 80ch; }
.reading.policy h2 { font-size: 40px; margin: 0 0 12px; }
.reading code, .policy code { font: 400 .9em var(--mono); background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 1px 5px; border-radius: 3px; }
.reading table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
.reading th, .reading td { text-align: left; vertical-align: top; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); }
.reading th { font-weight: 500; border-bottom-color: var(--ink); }

/* footer */
footer.site { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 20px clamp(16px, 3vw, 56px) 28px; border-top: 1px solid var(--line); color: var(--gray); font-size: 12px; }
footer.site p { margin: 0; }
footer.site nav { display: flex; gap: 6px; }
footer.site nav a { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r); color: var(--ink); transition: transform .15s ease-out, background-color .15s ease-out; }
footer.site nav a:hover { transform: translateY(-2px); background: color-mix(in srgb, currentColor 10%, transparent); }
#ft-linkedin { color: #0A66C2; }
#ft-whatsapp { color: #1FA855; }
#ft-email { color: #EA4335; }
:root[data-theme="dark"] #ft-linkedin { color: #4A9BE8; }
:root[data-theme="dark"] #ft-whatsapp { color: #25D366; }

/* page */
main { padding: 32px clamp(16px, 3vw, 56px) 64px; max-width: 1680px; width: 100%; margin: 0 auto; flex: 1 0 auto; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.filters { display: flex; gap: 22px; flex-wrap: wrap; margin: 0 0 20px; }
.filters .pill { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 4px 0; filter: none; color: var(--gray); }
.filters .pill:hover { color: var(--ink); }
.filters .pill[aria-pressed="true"] { background: none; color: var(--ink); border-bottom-color: var(--ink); }

/* index list */
.index { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
.index a { display: grid; grid-template-columns: 56px minmax(0, 1fr) 90px 120px; gap: 20px; align-items: baseline; padding: 18px 12px; margin: 0 -12px; border-top: 1px solid var(--line); text-decoration: none; }
.index .title { font-size: 28px; letter-spacing: -0.03em; line-height: 1.12; overflow-wrap: anywhere; }
.index a:hover .title, .index a:focus-visible .title { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
.index .no-summary .title { color: var(--gray); }
.index a:hover, .index a:focus-visible { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.index .num, .index .app, .index .date { color: var(--gray); font: 400 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
.index .num { font-size: 20px; color: var(--ink); }
.index .date { text-align: right; }
.empty-state { padding: 48px 0; max-width: 48ch; }

.settings { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.settings label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.settings input { accent-color: var(--dark); }

/* meeting article */
.article { display: grid; grid-template-columns: minmax(0, 1fr) 10px var(--drawer); gap: 0; align-items: start; }
.body { padding-right: 40px; min-width: 0; }
.toolrow { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.tools { display: flex; gap: 18px; }
.link.danger { color: var(--rec); }
.link:disabled { color: var(--gray); cursor: default; text-decoration: none; }
input.rename { display: block; width: 100%; margin: 6px 0 12px; font: inherit; font-size: 40px; letter-spacing: -0.03em; line-height: 1.05; border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 4px 18px; background: var(--surface); }
.masthead { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; align-items: end; margin: 24px 0 12px; }
.masthead .big-num { font: 300 72px/.85 var(--mono); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.meeting-title { font-size: 40px; letter-spacing: -0.03em; line-height: 1.05; font-weight: 400; margin: 0; overflow-wrap: anywhere; }
.head + .meeting-title { margin: 6px 0 12px; }
.meta { display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--gray); margin: 0 0 28px 164px; }
.sec { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; padding: 24px 0; border-top: 1px solid var(--line); }
.sec > .lbl { padding-top: 4px; }
.reading { font-size: 16px; line-height: 1.6; max-width: 80ch; }
.reading h1, .reading h2, .reading h3 { font-weight: 400; font-size: 20px; letter-spacing: -0.02em; line-height: 1.25; margin: 24px 0 8px; }
.reading > :first-child { margin-top: 0; }
.reading ul { padding-left: 1.2em; margin: 8px 0; }
.reading li { margin: 4px 0; }
.reading p { margin: 8px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
.actions .msg { color: var(--gray); }
textarea.notes { width: 100%; min-height: 160px; border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 16px 18px; background: var(--surface); font-size: 16px; line-height: 1.6; resize: vertical; }
.saved { color: var(--gray); font-size: 12px; }

/* resizable drawer */
.handle { align-self: stretch; cursor: col-resize; display: grid; place-items: center; touch-action: none; }
.handle::after { content: ""; width: 2px; height: 48px; border-radius: 2px; background: var(--line); }
.handle:hover::after, .handle:focus-visible::after { background: var(--gray); }
.drawer { position: sticky; top: 88px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; height: calc(100vh - 120px); min-height: 420px; overflow: hidden; }
.drawer header { padding: 18px 20px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dl { position: relative; display: inline-block; }
.dl > summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.dl > summary::-webkit-details-marker { display: none; }
.dl svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dl-menu { position: absolute; top: 100%; left: 0; margin-top: 6px; min-width: 190px; z-index: 5; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--ink); border-radius: var(--r-lg); overflow: hidden; }
.dl-menu button { text-align: left; padding: 11px 16px; border: 0; background: none; font: inherit; color: var(--ink); cursor: pointer; }
.dl-menu button + button { border-top: 1px solid var(--line); }
.dl-menu button:hover, .dl-menu button:focus-visible { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.pinmark { margin-left: 12px; font: 400 12px/1 var(--mono); color: var(--rec); letter-spacing: .04em; vertical-align: middle; }
.drawer .privacy { padding: 0 20px 10px; font-size: 12px; color: var(--gray); }
.chat-log { overflow-y: auto; padding: 4px 20px 16px; display: grid; align-content: start; gap: 10px; }
.msg { border-radius: var(--r-lg); padding: 10px 14px; max-width: 92%; overflow-wrap: anywhere; font-size: 14px; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
.msg ul { margin: 4px 0; padding-left: 1.1em; }
.msg.me { justify-self: end; background: var(--btn); color: var(--on-btn); }
.msg.bot { justify-self: start; background: var(--bg); }
.msg small { display: block; margin-top: 6px; color: var(--gray); font-size: 12px; }
.chat-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; border-top: 1px solid var(--line); }
.chat-chips .pill { padding: 4px 10px; font-size: 12px; }
.chat-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; padding: 10px 16px 16px; }
.chat-form textarea { border: 1px solid var(--edge); border-radius: var(--r); padding: 9px 14px; background: var(--surface); resize: none; max-height: 160px; }
#chat-msg { grid-column: 1 / -1; font-size: 12px; }
#chat-msg:empty { display: none; }

/* live view */
.live { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.live-note { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; }
.live-note p { margin: 0 0 6px; }

/* record sheet */
dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: var(--scrim); }
.sheet { padding: 28px 28px 24px; display: grid; gap: 18px; }
.sheet h2 { margin: 0; font-weight: 400; }
.field { display: grid; gap: 6px; }
.cfg-fields { display: grid; gap: 22px; max-width: 640px; }
.gacc { margin-top: 4px; }
.glist { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 8px; }
.glist li { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.glist label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.cfg-row { display: flex; gap: 16px; align-items: baseline; font-size: 14px; }
.help { margin: 0; font-size: 12px; }
.field input:disabled { background: var(--bg); color: var(--gray); }
.field textarea { border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 12px 14px; background: var(--surface); width: 100%; font: inherit; resize: vertical; }
.field input[type="text"], .field input[type="password"], .field select { border: 1px solid var(--edge); border-radius: var(--r); padding: 9px 14px; background: var(--surface); min-width: 0; width: 100%; }
.seg { display: inline-flex; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--edge); border-radius: var(--r); padding: 7px 16px; cursor: pointer; }
.seg input:checked + span { font-weight: 500; }
.seg label:has(input:checked) { background: var(--btn); color: var(--on-btn); border-color: var(--btn); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { accent-color: var(--btn); }
.sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.closed { min-height: 100vh; display: grid; place-content: center; padding: 32px; max-width: 60ch; margin: 0 auto; }

@media (max-width: 860px) {
  .top { grid-template-columns: 1fr auto; padding: 12px 16px; }
  .top nav { grid-column: 1 / -1; order: 3; }
  .top .wordmark { order: 1; justify-self: start; }
  .top .right { order: 2; }
  #status:not(:empty), #detected, #upcoming-panel { padding-left: 16px; padding-right: 16px; }
  #strip { padding: 12px 16px; }
  #strip .devs { flex: 1 1 100%; }
  main { padding: 24px 16px 48px; }
  .index a { grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; }
  .index .title { font-size: 20px; letter-spacing: -0.02em; }
  .index .app, .index .date { grid-column: 2; text-align: left; font-size: 12px; }
  .meeting-title, input.rename { font-size: 28px; }
  .masthead { grid-template-columns: 1fr; gap: 8px; }
  .masthead .big-num { font-size: 44px; }
  .meta { margin-left: 0; }
  .article { grid-template-columns: 1fr; }
  .handle { display: none; }
  .body { padding-right: 0; }
  .drawer { position: static; height: auto; max-height: none; margin-top: 24px; }
  .sec { grid-template-columns: 1fr; gap: 8px; }
  .live { grid-template-columns: 1fr; }
  #upcoming-panel li { grid-template-columns: 52px 1fr; }
  #upcoming-panel li .pill { grid-column: 2; justify-self: start; }
}
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; padding: 16px 0 56px; }
  .hero .frame { margin-right: 0; }
  .about-sec, .step { grid-template-columns: 1fr; gap: 10px; }
  .step .num { font-size: 48px; }
  .step .pair { grid-template-columns: 1fr; }
  .step .pair .frame { max-width: 320px; }
  .fact { grid-template-columns: 1fr; gap: 4px; }
  .reading table { display: block; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

function applyLang(save = true) {
  document.documentElement.lang = uiLang === "pt" ? "pt-BR" : "en";
  for (const [sel, attr, key] of STATIC) {
    for (const el of document.querySelectorAll(sel)) { if (attr) el.setAttribute(attr, t(key)); else el.textContent = t(key); }
  }
  for (const b of document.querySelectorAll(".langsw button")) b.setAttribute("aria-pressed", b.dataset.lang === uiLang);
  applyTheme(document.documentElement.dataset.theme === "dark", false);
  if (save) { try { localStorage.setItem(LANG_KEY, uiLang); } catch { /* storage may be blocked */ } }

let status = { phase: "idle", levels: { mic: 0, system: 0 } };

const api = async (path, opts = {}) => {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || t("Error {n}", { n: res.status }));
  return data;
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
function markdown(md, join = false) {
  let html = "", list = false, table = 0, buf = "", tag = "";  // table: 0 none, 1 header row seen, 2 inside the body
  const flush = () => { if (buf) html += `<${tag}>${inline(buf)}</${tag}>`; buf = ""; };
  for (const line of md.split(/\r?\n/)) {
    const h = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/), row = line.match(/^\s*\|(.*)\|\s*$/);
    if (buf && (!join || h || li || row || !line.trim())) flush();
    if (!li && list && !(join && buf && line.trim() && !h && !row)) { html += "</ul>"; list = false; }
    if (!row && table) { html += "</tbody></table>"; table = 0; }
    if (row) {
      const cells = row[1].split("|").map(c => c.trim());
      if (cells.every(c => /^:?-+:?$/.test(c))) { html += "</thead><tbody>"; table = 2; continue; }
      if (!table) { html += "<table><thead>"; table = 1; }
      const cell = table === 1 ? "th" : "td";
      html += `<tr>${cells.map(c => `<${cell}>${inline(c)}</${cell}>`).join("")}</tr>`;
    }
    else if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (li) { if (!list) { html += "<ul>"; list = true; } buf = li[1].replace(/^\[[ x]\]\s*/, ""); tag = "li"; }
    else if (line.trim()) { if (join && buf) buf += " " + line.trim(); else { flush(); buf = line.trim(); tag = "p"; } }
  }
  flush();
  return html + (list ? "</ul>" : "") + (table ? "</tbody></table>" : "");
}

const clock = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(x).padStart(2, "0"); };
const when = iso => new Date(iso).toLocaleString(locale(), { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const dateOnly = iso => new Date(iso).toLocaleDateString(locale(), { month: "short", day: "numeric" });
const timeOf = iso => new Date(iso).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit", hour12: false });
const duration = m => m.ended_at ? `${Math.max(1, Math.round((new Date(m.ended_at) - new Date(m.started_at)) / 60000))} min` : "";
const titleOf = m => m.title || t("Untitled meeting");

// The 1 s poll never wipes a message: it stays until the user acts or the phase changes.
function showError(msg) { notice = `<span class="error">${esc(msg)}</span>`; statusEl.innerHTML = notice; }
function showInfo(msg) { notice = esc(msg); statusEl.innerHTML = notice; }

/* ---------- routing ---------- */
function currentRoute() {
  if (location.hash === "#/settings") return { name: "settings" };
  if (location.hash === "#/about") return { name: "about" };
  if (location.hash === "#/privacy") return { name: "privacy" };
  const m = location.hash.match(/^#\/m\/([\w-]+)$/);
  return m ? { name: "meeting", id: m[1] } : { name: "index" };
}
async function route() {
  await flushNotes();
  const r = currentRoute();
  for (const [nav, name] of [["#nav-index", "index"], ["#nav-settings", "settings"], ["#nav-about", "about"]]) {
    if (r.name === name) $(nav).setAttribute("aria-current", "page"); else $(nav).removeAttribute("aria-current");
  }
  if (r.name === "index") { openId = openMeeting = null; return renderIndex(); }
  if (r.name === "settings") { openId = openMeeting = null; return renderSettings(); }
  if (r.name === "about") { openId = openMeeting = null; renderAbout(); return window.scrollTo(0, 0); }
  if (r.name === "privacy") { openId = openMeeting = null; await renderPrivacy(); return window.scrollTo(0, 0); }
  try {
    openMeeting = await api(`/api/meetings/${r.id}`);
  } catch {
    location.hash = "#/";
    return showError(t("That meeting no longer exists."));
  }
  if (openId !== r.id) draft = "";
  openId = r.id;
  renderMeeting();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- index ---------- */
async function loadMeetings() {
  meetings = await api("/api/meetings");
  const byAge = [...meetings].sort((a, b) => a.started_at.localeCompare(b.started_at));
  numbers = new Map(byAge.map((m, i) => [m.id, String(i + 1).padStart(2, "0")]));
}
const FILTERS = {
  all: m => !m.archived,
  week: m => !m.archived && Date.now() - new Date(m.started_at) < 7 * 864e5,
  next: m => !m.archived && m.has_next_steps,
  archived: m => m.archived,
};
async function renderIndex() {
  try { await loadMeetings(); } catch (err) { return showError(err.message); }
  const shown = meetings.filter(FILTERS[filter]), active = meetings.filter(FILTERS.all).length;
  const pill = (key, label) => `<button class="pill ghost" data-filter="${key}" aria-pressed="${filter === key}">${label}</button>`;
  view.innerHTML = `
    <div class="head"><span class="lbl">${active === 1 ? t("(Index – 1 meeting)") : t("(Index – {n} meetings)", { n: active })}</span></div>
    <div class="filters" role="group" aria-label="${t("Filter meetings")}">${pill("all", t("All"))}${pill("week", t("This week"))}${pill("next", t("With next steps"))}${pill("archived", t("Archived"))}</div>
    ${!meetings.length ? `<div class="empty-state"><p class="t20">${t("No meetings yet.")}</p><p class="muted">${t("Press Record to start your first one.")}</p><p><a href="#/about">${t("New here? See how it works.")}</a></p></div>`
      : !shown.length ? `<div class="empty-state"><p class="muted">${filter === "archived" ? t("No archived meetings.") : t("No meetings match this filter.")}</p></div>`
      : `<ol class="index">${shown.map(m => `<li><a href="#/m/${m.id}" class="${m.has_summary ? "" : "no-summary"}">
          <span class="num">${numbers.get(m.id)}</span><span class="title">${esc(titleOf(m))}${m.pinned ? `<span class="pinmark">${t("Pinned")}</span>` : ""}</span>
          <span class="app">${esc(m.app || "")}</span><span class="date">${dateOnly(m.started_at)}</span></a></li>`).join("")}</ol>`}
    `;
  view.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.filter; renderIndex(); }));
}

function mailStatus(m) {

  if (!m.email_configured) return "";
  if (m.email_error) return `<span class="error">${esc(t("Email not sent: {e}", { e: m.email_error }))}</span>`;
  if (m.emailed_at) return esc(t("Sent to Gmail {d}", { d: when(m.emailed_at) }));
  return "";
}
function renderMeeting() {

async function send(text, typed) {

  const id = openId;
  waiting = id;
  if (typed) draft = "";
  openMeeting.chat.push({ role: "user", content: text });
  renderMeeting();
  try {
    const m = await api(`/api/meetings/${id}/chat`, { method: "POST", body: JSON.stringify({ message: text }) });
    waiting = null;
    if (openId !== id) return;
    openMeeting = m;
    renderMeeting();
    $("#chat-input")?.focus();
  } catch (err) {
    waiting = null;
    if (typed) draft = text;

/* ---------- resizable drawer ---------- */
const DRAWER_KEY = "metranscript.drawerWidth", DRAWER_MIN = 320;
const drawerDefault = () => Math.round(Math.min(520, Math.max(380, innerWidth * 0.26)));
const drawerMax = () => Math.min(innerWidth * 0.5, 640);
function setDrawer(px, save = true) {
  const w = Math.round(Math.min(drawerMax(), Math.max(DRAWER_MIN, px)));
  document.documentElement.style.setProperty("--drawer", `${w}px`);
  $("#handle")?.setAttribute("aria-valuenow", w);
  if (save) { try { localStorage.setItem(DRAWER_KEY, w); } catch { /* storage may be blocked */ } }
}
function bindHandle() {
  const h = $("#handle");
  h.setAttribute("aria-valuemin", DRAWER_MIN);
  h.setAttribute("aria-valuemax", Math.round(drawerMax()));
  h.setAttribute("aria-valuenow", parseInt(getComputedStyle(document.documentElement).getPropertyValue("--drawer")));
  h.addEventListener("pointerdown", e => {
    h.setPointerCapture(e.pointerId);
    const move = ev => setDrawer(innerWidth - ev.clientX - (innerWidth - h.parentElement.getBoundingClientRect().right));
    h.addEventListener("pointermove", move);
    h.addEventListener("pointerup", () => h.removeEventListener("pointermove", move), { once: true });
  });
  h.addEventListener("dblclick", () => setDrawer(drawerDefault()));
  h.addEventListener("keydown", e => {
    const step = { ArrowLeft: 16, ArrowRight: -16 }[e.key];
    if (step) { e.preventDefault(); setDrawer(parseInt(h.getAttribute("aria-valuenow")) + step); }
  });
}
try { const saved = parseInt(localStorage.getItem(DRAWER_KEY)); if (saved) setDrawer(saved, false); } catch { /* storage may be blocked */ }

/* ---------- notes autosave ---------- */
let dirty = null, saveTimer = null, saveFailed = false;
const savedLabel = text => { const el = $(".saved"); if (el) el.textContent = text; };
function bindNotes(textarea, id) {
  if (saveFailed) savedLabel(t("Not saved. Retrying…"));
  textarea.addEventListener("input", () => {
    dirty = { id, notes: textarea.value };
    if (openMeeting?.id === id) openMeeting.notes = textarea.value;
    savedLabel(t("Saving…"));
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushNotes, 700);
  });
}
async function flushNotes(keepalive = false) {
  clearTimeout(saveTimer);
  if (!dirty) return;
  const d = dirty;
  dirty = null;
  try {
    await api(`/api/meetings/${d.id}/notes`, { method: "PUT", keepalive, body: JSON.stringify({ notes: d.notes }) });
    saveFailed = false;
    if (!dirty) savedLabel(t("Saved"));
  } catch (err) {
    dirty ??= d;
    saveFailed = true;
    savedLabel(t("Not saved ({e}). Retrying…", { e: err.message }));
    saveTimer = setTimeout(flushNotes, 3000);
  }
}
window.addEventListener("beforeunload", e => {
  if (!dirty) return;
  const failed = saveFailed;
  flushNotes(true);
  if (failed) e.preventDefault();
});

/* ---------- status polling ---------- */
let polling = null;
const poll = () => polling ??= refresh().finally(() => { polling = null; });
async function refresh() {
  try { status = await api("/api/status"); } catch { statusEl.textContent = t("Cannot reach MeTranscript. Is the program running?"); return; }
  const p = status.phase, rec = p === "recording", busy = BUSY.includes(p);
  document.body.classList.toggle("recording", busy);
  document.body.classList.toggle("on-air", rec);
  document.title = rec ? `● ${clock(status.elapsed || 0)} MeTranscript` : "MeTranscript";
  if (busy) {
    recordingId = status.meeting_id;
    const m = meetings.find(x => x.id === status.meeting_id) || (openMeeting?.id === status.meeting_id ? openMeeting : null);
    $("#strip-label").textContent = rec ? t("(Recording – {t})", { t: m ? titleOf(m) : t("meeting") })
      : p === "transcribing" ? t("(Transcribing – {n}%)", { n: Math.round((status.progress || 0) * 100) }) : t("(Writing the summary…)");
    $("#strip-clock").textContent = clock(status.elapsed || 0);
    $("#stop").disabled = !rec;
    $("#lv-mic").style.width = Math.min(100, status.levels.mic * 100) + "%";
    $("#lv-system").style.width = Math.min(100, status.levels.system * 100) + "%";
    const onIt = openId === status.meeting_id;
    $("#strip-back").hidden = onIt;
    $("#strip-back").href = `#/m/${status.meeting_id}`;
    if (rec && status.devices) {
      if (prevPhase !== "recording" || !$("#strip-mic").options.length) {
        if (!deviceList.mics.length) { try { deviceList = await api("/api/devices"); } catch { /* shown on next action */ } }
        fillDevices($("#strip-mic"), deviceList.mics, false, status.devices.mic);
        fillDevices($("#strip-system"), deviceList.speakers, false, status.devices.system);
      }
      for (const [track, name] of Object.entries(status.devices)) {
        const sel = $(`#strip-${track}`);
        if (document.activeElement !== sel && sel.value !== name) sel.value = name;
      }
    }
  }
  if (p === "transcribing" && $("#proc-msg")) $("#proc-msg").textContent = t("Transcribing the audio… {n}%", { n: Math.round((status.progress || 0) * 100) });
  if (prevPhase !== p) notice = null;
  statusEl.innerHTML = notice ?? (status.error ? `<span class="error">${esc(status.error)}</span>` : "");
  if (rec && openId === status.meeting_id) {
    if (!$("#live-note")) renderLive();
  }
  const finished = BUSY.includes(prevPhase) && !busy;
  if (prevPhase !== p && openId === status.meeting_id && openId && !finished) {
    await flushNotes();
    openMeeting = await api(`/api/meetings/${openId}`).catch(() => openMeeting);
    renderMeeting();
  }
  if (finished && recordingId) {
    const id = recordingId;
    recordingId = null;
    if (location.hash === `#/m/${id}`) route(); else location.hash = `#/m/${id}`;
  }
  if (currentRoute().name === "index" && prevPhase !== p) renderIndex();
  prevPhase = p;
  showDetected();
}

function showDetected() {

  $("#detected").classList.toggle("show", show);
  if (!show || shownKey === d.key) return;
  shownKey = d.key;
  $("#detected-text").textContent = t("{app} is using the microphone. Did a meeting start?", { app: d.app });
  if ("Notification" in window && Notification.permission === "granted" && document.hidden) {

    n.onclick = () => { window.focus(); n.close(); };
  }
}

    <div class="actions"><button type="button" class="pill dark" id="google-login" ${g.configured ? "" : "disabled"}>${t("Sign in with Google")}</button>
      <button type="button" class="pill ghost" id="test-email" ${g.accounts.length ? "" : "disabled"}>${t("Send a test email")}</button>
      ${g.configured ? "" : `<span class="muted">${t("Save the client ID and secret first.")}</span>`}</div></div>`;
  const field = d => {
    const f = cfg[d.name] || { set: false, locked: false, value: null };  // an older server does not know every key
    return `<div class="field">
      <label class="lbl" for="cfg-${d.name}">${t(d.label)}</label>
      <input id="cfg-${d.name}" data-name="${d.name}" type="${d.secret ? "password" : "text"}" autocomplete="${d.secret ? "new-password" : "off"}"
        spellcheck="false" placeholder="${f.set ? (d.secret ? t("Saved. Type a new value to replace it") : "") : t("Not set")}"
        value="${d.secret ? "" : esc(f.value || "")}" ${f.locked ? "disabled" : ""}>
      <div class="cfg-row"><span class="${f.set ? "" : "muted"}">${stateText(f)}</span>
        ${f.set && !f.locked ? `<button type="button" class="link danger" data-remove="${d.name}">${t("Remove")}</button>` : ""}</div>
      ${d.help ? `<p class="muted help">${t(d.help)}</p>` : ""}</div>`;
  };
  view.innerHTML = `
    <div class="head"><span class="lbl">${t("(Settings)")}</span></div>
    <h1 class="meeting-title">${t("Settings")}</h1>
    <p class="muted" style="max-width:60ch">${t("Keys are stored only in the .env file on this computer. This page never shows them back.")}</p>
    <form id="cfg-form" autocomplete="off">
      ${SETTINGS.map(s => `<section class="sec"><span class="lbl">${t(s.num)}</span><div class="cfg-fields">${s.fields.map(field).join("")}
        ${s.google ? googleBlock(google) : ""}</div></section>`).join("")}
      <div class="actions" style="margin: 8px 0 32px"><button class="pill dark" id="cfg-save">${t("Save settings")}</button></div>
    </form>
    <section class="sec"><span class="lbl">${t("(05) Protected terms")}</span><div class="cfg-fields">
      <form id="terms-form"><div class="field">
        <label class="lbl" for="terms">${t("Names, clients and projects to hide")}</label>
        <textarea id="terms" rows="8" spellcheck="false" placeholder="${t("One per line, for example a client or project name")}">${esc(terms.join("\n"))}</textarea>
        <p class="muted help">${t("Each one is replaced by a code before anything goes to DeepSeek and put back in the answer. Emails, links, phone and ID numbers, money amounts and keys are always hidden, with no need to list them. A single word that Whisper misspells is caught too. The list stays in sensitive-terms.txt on this computer.")}</p></div>
        <div class="actions"><button class="pill dark" id="terms-save">${t("Save terms")}</button></div></form></div></section>
    <section class="sec"><span class="lbl">${t("(06) App")}</span><div class="settings">
      <label><input type="checkbox" id="autostart"> ${t("Run in background and start with Windows")}</label>
      <button class="link" id="quit">${t("Quit MeTranscript")}</button></div></section>`;
  $("#cfg-form").addEventListener("submit", async e => {
    e.preventDefault();
    const updates = {};
    for (const input of view.querySelectorAll("input[data-name]")) {
      const v = input.value.trim(), f = cfg[input.dataset.name];
      if (!input.disabled && v && v !== (f.value || "")) updates[input.dataset.name] = v;
    }
    if (!Object.keys(updates).length) return showInfo(t("Nothing to save."));
    try { await api("/api/config", { method: "PUT", body: JSON.stringify(updates) }); await renderSettings(); showInfo(t("Settings saved.")); }
    catch (err) { showError(err.message); }
  });
  $("#terms-form").addEventListener("submit", async e => {
    e.preventDefault();
    try { await api("/api/privacy", { method: "PUT", body: JSON.stringify({ terms: $("#terms").value }) }); await renderSettings(); showInfo(t("Terms saved.")); }
    catch (err) { showError(err.message); }
  });
  view.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", async () => {
    try { await api("/api/config", { method: "PUT", body: JSON.stringify({ [b.dataset.remove]: null }) }); await renderSettings(); showInfo(t("Removed.")); }
    catch (err) { showError(err.message); }
  }));
  $("#google-login")?.addEventListener("click", async e => {
    e.target.disabled = true;
    try { const { url } = await api("/api/google/login", { method: "POST", body: "{}" }); location.href = url; }
    catch (err) { e.target.disabled = false; showError(err.message); }
  });
  view.querySelectorAll('input[name="sender"]').forEach(r => r.addEventListener("change", async () => {
    try { await api("/api/google/sender", { method: "POST", body: JSON.stringify({ email: r.value }) }); showInfo(t("Sending summaries from {a}.", { a: r.value })); }
    catch (err) { showError(err.message); await renderSettings(); }
  }));
  view.querySelectorAll("[data-disconnect]").forEach(b => b.addEventListener("click", async () => {
    try {
      const { revoked } = await api("/api/google/disconnect", { method: "POST", body: JSON.stringify({ email: b.dataset.disconnect }) });
      await renderSettings();
      showInfo(revoked ? t("Disconnected.") : t("Disconnected here, but Google did not confirm. Also remove MeTranscript at myaccount.google.com/permissions."));
    } catch (err) { showError(err.message); }
  }));
  $("#test-email")?.addEventListener("click", async e => {
    e.target.disabled = true;
    showInfo(t("Sending the test email…"));
    try { await api("/api/config/test-email", { method: "POST" }); showInfo(t("Test email sent. Check your inbox.")); }
    catch (err) { showError(err.message); }
    e.target.disabled = false;
  });
  bindSettings();
}

async function getStarted() {
  let cfg;
  try { cfg = await api("/api/config"); } catch (err) { return showError(err.message); }
  if (!cfg.DEEPSEEK_API_KEY?.set) { location.hash = "#/settings"; return showInfo(t("Add your DeepSeek key, then press Record.")); }
  openRecordSheet();
}

function renderAbout() {
  const img = (name, w, h, alt) => `<div class="frame"><img src="/about/${name}-${uiLang}.png" width="${w}" height="${h}" alt="${esc(alt)}" loading="lazy"></div>`;
  const start = `<button class="pill rec big" data-start>${t("Get started")}</button>`;
  view.innerHTML = `<div class="about">
    <section class="hero">
      <div><h1>${t("Meeting notes without a bot.")}</h1>
        <p class="lead">${t("MeTranscript records your Meet, Zoom and Teams calls on your own computer, writes the minutes, and lets you question them.")}</p>
        <div class="cta">${start}<button class="link" data-scroll="about-how">${t("See how it works")}</button></div></div>
      <div class="frame"><img src="/about/meeting-${uiLang}.png" width="1400" height="804" alt="${esc(t("A meeting with its summary and the chat beside it"))}"></div>
    </section>
    <span id="about-how" class="lbl about-how">${t("(How it works)")}</span>
    <section class="step"><span class="num">01</span><div><h2>${t("Record, with nothing in the call")}</h2>
      <p>${t("Press Record, or accept the alert when a call starts. The app captures your microphone and the call's audio as two separate tracks, so it knows who said what. Nobody joins the meeting.")}</p>
      ${img("recording", 1400, 268, t("The recording bar with the clock and level meters"))}</div></section>
    <section class="step"><span class="num">02</span><div><h2>${t("Get the minutes")}</h2>
      <p>${t("When you stop, the audio is transcribed on your computer and the AI writes the minutes: an overview, a section per topic, decisions, open questions and next steps, in the language of the meeting. Each meeting is a numbered entry in your list.")}</p>
      ${img("index", 1400, 500, t("The list of meetings, numbered"))}</div></section>
    <section class="step"><span class="num">03</span><div><h2>${t("Ask it, and ask what it thinks")}</h2>
      <div class="pair"><p>${t("Question the meeting, change the summary with a sentence, or press Explain, Risks, Suggestions or Your opinion. The AI keeps what was said apart from its own opinion, so you always know which is which.")}</p>
      ${img("chat", 420, 790, t("A chat answer that separates what was said from the AI's opinion"))}</div></div></section>
    <section class="about-sec"><span class="lbl">${t("(Privacy)")}</span><div><h2 class="about-title">${t("What leaves your computer")}</h2>
      <div class="facts">
        <div class="fact"><b>${t("Audio")}</b><span>${t("Never. It is transcribed on your computer and kept as a small file you can delete.")}</span></div>
        <div class="fact"><b>${t("Text of the meeting")}</b><span>${t("Sent to DeepSeek only when a summary or a chat answer is made, after names, contacts, amounts and IDs are swapped for codes.")}</span></div>
        <div class="fact"><b>${t("Google accounts")}</b><span>${t("Optional. The summary is emailed to you, and only your next 24 hours of events are read.")}</span></div></div>
      <p class="about-note"><b>${t("Tell the participants first.")}</b> ${t("MeTranscript does not tell the other people that you are recording. The app asks you to confirm that you told them before every recording, and gives you a notice to paste in the call chat.")}</p>
      <a href="#/privacy">${t("Read the full privacy policy")}</a></div></section>
    <section class="about-sec"><span class="lbl">${t("(Made by)")}</span><div>
      <p class="about-note first">${t("Made by Aurélio Venturelli. Free software under the MIT license.")}</p>
      <a href="https://github.com/venturelli-91/me_transcript" target="_blank" rel="noopener noreferrer">${t("Source code on GitHub")}</a></div></section>
    <section class="about-end"><h2>${t("Ready when you are.")}</h2>
      <div class="cta">${start}<a class="link" href="#/settings">${t("Open Settings")}</a></div></section></div>`;
  view.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", getStarted));
  view.querySelector("[data-scroll]").addEventListener("click", e => {
    $("#" + e.currentTarget.dataset.scroll).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });
}

async function renderPrivacy() {
  let md;
  try { ({ markdown: md } = await api("/api/policy?lang=" + uiLang)); }
  catch (err) { view.innerHTML = `<p class="error">${esc(err.message)}</p>`; return showError(err.message); }
  view.innerHTML = `<div class="head"><span class="lbl">${t("(Privacy)")}</span></div><article class="policy reading">${markdown(md, true)}</article>`;
}

document.querySelectorAll(".langsw button").forEach(b => b.addEventListener("click", async () => {
  if (b.dataset.lang === uiLang) return;
  uiLang = b.dataset.lang;
  applyLang();
  await route();
  loadAgenda();
  poll();
}));

window.addEventListener("unhandledrejection", e => showError(e.reason?.message || String(e.reason)));

/* ---------- start ---------- */
(async function boot() {
  applyLang(false);
  await loadMeetings().catch(() => {});
  await route();
  loadAgenda();
  setInterval(loadAgenda, 60000);
  (async function loop() { if (closed) return; await poll(); setTimeout(loop, 1000); })();
  const google = new URLSearchParams(location.search).get("google");
  if (google) {
    history.replaceState(null, "", "/" + location.hash);
    if (google === "connected") showInfo(t("Google account connected."));
    else if (google === "denied") showInfo(t("Google sign-in was cancelled."));
    else showError(t("Could not connect the Google account. Try again."));
  }
  const reminderToken = new URLSearchParams(location.search).get("record");
  if (reminderToken) {
    history.replaceState(null, "", "/" + location.hash);
    openRecordSheet({ reminder: reminderToken });
  }
})();
</script>
</body>
</html>
